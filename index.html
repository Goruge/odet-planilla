<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1428">
<title>Planilla ODET</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* ── ODET palette (de styles.qss: navy #16203A / #0A1428 + dorado #CCA352) ── */
:root{
  --navy:#16203A; --navy-deep:#0A1428; --gold:#CCA352; --gold-2:#B98C3E;
  --paper:#F2F4F8; --surface:#FFFFFF; --surface-2:#EAEEF4;
  --ink:#16203A; --ink-soft:#5B6678; --line:#E1E6EF; --line-2:#D3DAE6;
  --bajo:#B5544E; --basico:#B98C3E; --alto:#4E8C6A; --superior:#2F7A52;
  --cog:#3C6DA6; --proc:#4E8C6A; --act:#8A5CA8; --eval:#CCA352;
  --on-navy:#E1E6EF; --on-navy-soft:#9AA8BE;
}
@media(prefers-color-scheme:dark){:root{
  --paper:#0C1526; --surface:#141F35; --surface-2:#1B2842; --ink:#E1E6EF;
  --ink-soft:#92A0B5; --line:#25324B; --line-2:#2C3A55;
  --bajo:#D9756E; --basico:#D8B24E; --alto:#5FB088; --superior:#54C083;
  --cog:#6098D0; --proc:#5FB088; --act:#B285CE; --eval:#E4C070;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased; padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
h1,h2,h3{font-family:"Fraunces",Georgia,serif; margin:0}
button{font-family:inherit; cursor:pointer}
input{font-family:inherit; font-size:16px}
.mono{font-family:"IBM Plex Mono",monospace}
.hidden{display:none !important}
.hint{color:var(--ink-soft); font-size:.9rem}

/* header — chrome navy siempre */
.top{position:sticky; top:0; z-index:5; background:var(--navy);
  display:flex; align-items:center; gap:12px; padding:11px 16px;
  padding-top:calc(11px + env(safe-area-inset-top)); border-bottom:1px solid #26324e}
.top img.mark{height:26px; width:auto; display:block}
.top .tt{flex:1; min-width:0}
.top .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--gold); display:block}
.top h1{font-size:1.05rem; color:var(--on-navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.icon-btn{background:transparent; border:1px solid #36436180; color:var(--on-navy-soft); border-radius:9px;
  padding:7px 11px; font-size:.82rem}
.icon-btn:active{background:#1e2b47}

.wrap{max-width:720px; margin:0 auto; padding:16px}

/* login — navy profundo con logo */
.login{min-height:100vh; display:grid; place-items:center; padding:24px;
  background:radial-gradient(120% 90% at 50% 0%, #16233f 0%, var(--navy-deep) 70%)}
.login .inner{width:100%; max-width:370px}
.login .brand{text-align:center; margin-bottom:22px}
.login .brand img{height:70px; width:auto; margin-bottom:14px}
.login .brand .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.24em;
  text-transform:uppercase; color:var(--gold)}
.login .brand h1{font-size:1.55rem; color:var(--on-navy); margin-top:4px}
.login .card{background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:24px 22px; box-shadow:0 18px 50px -24px #000}
label{display:block; font-size:.8rem; color:var(--ink-soft); margin:14px 0 5px; font-weight:500}
label:first-child{margin-top:0}
input[type=email],input[type=password]{width:100%; padding:12px 13px; border:1px solid var(--line-2);
  border-radius:10px; background:var(--paper); color:var(--ink)}
input:focus{outline:2px solid var(--gold); outline-offset:1px}
.btn{width:100%; margin-top:20px; padding:13px; border:none; border-radius:10px; background:var(--navy);
  color:#fff; font-weight:600; font-size:1rem}
.btn:active{filter:brightness(1.15)}
.btn.gold{background:var(--gold); color:#20170a}
.err{color:var(--bajo); font-size:.85rem; margin-top:12px; min-height:1.1em; text-align:center}

/* planillas */
.plist{display:grid; gap:11px; margin-top:6px}
.pcard{display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--line);
  border-radius:13px; padding:15px 16px; text-align:left; width:100%; color:inherit}
.pcard:active{background:var(--surface-2)}
.pcard .curso{font-family:"Fraunces",serif; font-size:1.5rem; font-weight:600; color:var(--gold);
  min-width:54px; text-align:center; font-variant-numeric:tabular-nums}
.pcard .meta{flex:1} .pcard .meta b{display:block} .pcard .meta span{font-size:.82rem; color:var(--ink-soft)}
.pcard .chev{color:var(--gold)}

/* reportes (barra) */
.reportes{display:flex; gap:9px; margin:2px 0 16px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px}
.rbtn{flex:1 0 auto; display:flex; flex-direction:column; align-items:flex-start; gap:3px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 13px; color:var(--ink);
  min-width:130px}
.rbtn:active{background:var(--surface-2)}
.rbtn .ic{font-size:1.05rem}
.rbtn b{font-size:.85rem}
.rbtn small{font-size:.66rem; color:var(--gold-2); font-family:"IBM Plex Mono",monospace; letter-spacing:.03em}

/* estudiantes */
.srow{display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:12px 13px; width:100%; text-align:left; color:inherit; margin-bottom:9px}
.srow:active{background:var(--surface-2)}
.srow .n{font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--ink-soft); min-width:20px; text-align:right}
.srow .cod{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--gold-2);
  background:var(--surface-2); border-radius:6px; padding:3px 7px; flex:none}
.srow .nom{flex:1; font-size:.95rem; min-width:0}
.srow .nom.sin{color:var(--ink-soft); font-style:italic}
.pill{font-family:"IBM Plex Mono",monospace; font-size:.85rem; font-weight:600; padding:4px 11px;
  border-radius:999px; color:#fff; min-width:46px; text-align:center; font-variant-numeric:tabular-nums; flex:none}

/* detalle estudiante */
.back{background:none; border:none; color:var(--gold-2); font-size:.92rem; padding:8px 0; margin-bottom:4px}
.hdr-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:16px}
.hdr-card h2{font-size:1.22rem}
.hdr-card .big{display:flex; align-items:center; gap:13px; margin-top:12px}
.hdr-card .big .num{font-family:"Fraunces",serif; font-size:2.4rem; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.saber{background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:14px; overflow:hidden}
.saber .sh{display:flex; align-items:center; gap:9px; padding:12px 16px; border-bottom:1px solid var(--line)}
.saber .sh .chip{width:11px; height:11px; border-radius:3px}
.saber .sh h3{font-size:1rem; flex:1} .saber .sh .w{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--ink-soft)}
.saber .sh .pct{font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--ink-soft)}
.act{display:flex; align-items:center; gap:10px; padding:11px 16px; border-top:1px solid var(--surface-2)}
.act .an{flex:1; font-size:.9rem} .act .an small{display:block; color:var(--ink-soft); font-size:.7rem; font-family:"IBM Plex Mono",monospace}
.omrtag{font-family:"IBM Plex Mono",monospace; font-size:.58rem; letter-spacing:.05em; color:var(--gold-2);
  border:1px solid var(--line-2); border-radius:5px; padding:1px 5px; margin-left:6px}
/* Rueda de nota INLINE: el scroll pasa dentro del recuadro, sin popup */
.act .wheel{width:74px; height:90px; overflow-y:scroll; scroll-snap-type:y mandatory; position:relative;
  border:1px solid var(--line-2); border-radius:12px; background:var(--paper); flex:none; touch-action:pan-y;
  scrollbar-width:none; -ms-overflow-style:none;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.act .wheel::-webkit-scrollbar{display:none}
.act .wtrack{padding:30px 0}
.act .wopt{height:30px; display:grid; place-items:center; scroll-snap-align:center;
  font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:.95rem;
  transition:color .12s, transform .12s}
.act .wopt.on{color:var(--gold-2); transform:scale(1.22)}
.act .wband{position:absolute; left:5px; right:5px; top:30px; height:30px; border-radius:8px;
  background:color-mix(in srgb,var(--gold) 15%, transparent);
  border:1px solid color-mix(in srgb,var(--gold) 45%, transparent); pointer-events:none}
.addact{display:flex; gap:8px; padding:11px 16px; border-top:1px solid var(--surface-2)}
.addact input{flex:1; padding:9px 11px; border:1px solid var(--line-2); border-radius:9px; background:var(--paper); color:var(--ink); font-size:.9rem}
.addact button{border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink); border-radius:9px; padding:0 14px; font-size:.85rem}

.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy); color:var(--on-navy);
  padding:10px 18px; border-radius:999px; font-size:.85rem; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; border:1px solid #36436160}
.toast.show{opacity:.98}
.spin{display:grid; place-items:center; padding:50px; color:var(--ink-soft)}

/* modal reportes */
.modal{position:fixed; inset:0; z-index:40; display:grid; place-items:end center; padding:0;
  background:#0a1428aa; opacity:0; pointer-events:none; transition:opacity .2s}
.modal.show{opacity:1; pointer-events:auto}
.sheet{background:var(--surface); width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:22px 22px calc(28px + env(safe-area-inset-bottom));
  border:1px solid var(--line); transform:translateY(20px); transition:transform .2s}
.modal.show .sheet{transform:none}
.sheet .grip{width:38px; height:4px; border-radius:2px; background:var(--line-2); margin:0 auto 16px}
.sheet h3{font-size:1.2rem; display:flex; align-items:center; gap:9px}
.sheet .soon{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.06em;
  color:var(--gold-2); border:1px solid var(--line-2); border-radius:6px; padding:2px 7px; margin-top:10px}
.sheet p{color:var(--ink-soft); font-size:.94rem; margin:12px 0 0}
.sheet .btn{background:var(--navy)}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="inner">
    <div class="brand">
      <img src="logo.png" alt="ODET">
      <div class="eyebrow">Planilla</div>
    </div>
    <form class="card" id="loginForm">
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="username" required placeholder="docente@correo.com">
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button class="btn gold" type="submit" id="loginBtn">Entrar</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="top">
    <img class="mark" src="logo.png" alt="ODET">
    <div class="tt"><span class="eyebrow">Planilla</span><h1 id="topTitle">Mis cursos</h1></div>
    <button class="icon-btn" id="backTop" style="display:none">← Atrás</button>
    <button class="icon-btn" id="logoutBtn">Salir</button>
  </div>
  <div class="wrap">
    <div id="viewPlanillas"></div>
    <div id="viewStudents" class="hidden"></div>
    <div id="viewStudent" class="hidden"></div>
  </div>
</div>

<!-- MODAL de reportes -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="grip"></div>
    <h3 id="mTitle"></h3>
    <div><span class="soon" id="mSoon">Pendiente del formato institucional</span></div>
    <p id="mBody"></p>
    <button class="btn" id="mClose" style="margin-top:22px">Entendido</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://ixnaffcfnskgxviopeod.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4bmFmZmNmbnNrZ3h2aW9wZW9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODc5OTUsImV4cCI6MjA5Njc2Mzk5NX0.OjdZ7oEs2XNkXDc_IqRIVyuRc2qHwJwLhA17tcbxaE8';
const sb=createClient(SUPABASE_URL,SUPABASE_ANON);

const SABERES=[
  {k:'cognitivo',label:'Cognitivo',color:'var(--cog)'},
  {k:'procedimental',label:'Procedimental',color:'var(--proc)'},
  {k:'actitudinal',label:'Actitudinal',color:'var(--act)'},
  {k:'evaluacion',label:'Evaluación de periodo',color:'var(--eval)'},
];
const $=s=>document.querySelector(s);
// Valores de nota (— , 1.0 … 5.0, paso 0.1) para la rueda inline.
const NOTA_VALS=(()=>{const a=[''];for(let v=10;v<=50;v++)a.push((v/10).toFixed(1));return a;})();
let PESOS={cognitivo:30,procedimental:40,actitudinal:20,evaluacion_periodo:10};
let CURRENT={planilla:null,estudiantes:[],actividades:[],notas:[]};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function desempeno(n){if(n==null)return{t:'—',c:'var(--ink-soft)'};if(n<3)return{t:'Bajo',c:'var(--bajo)'};if(n<4)return{t:'Básico',c:'var(--basico)'};if(n<=4.5)return{t:'Alto',c:'var(--alto)'};return{t:'Superior',c:'var(--superior)'};}
function esSinNombre(nom){return !nom || /^\(c[oó]digo/i.test(nom);}

// modal de reportes (placeholder hasta tener los formatos)
function abrirModal(titulo,cuerpo){$('#mTitle').textContent=titulo;$('#mBody').textContent=cuerpo;$('#modal').classList.add('show');}
$('#mClose').addEventListener('click',()=>$('#modal').classList.remove('show'));
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show');});

// ── Auth ──
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('#loginErr').textContent='';$('#loginBtn').disabled=true;$('#loginBtn').textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});
  $('#loginBtn').disabled=false;$('#loginBtn').textContent='Entrar';
  if(error){$('#loginErr').textContent=error.message.includes('Invalid')?'Correo o contraseña incorrectos.':error.message;return;}
  enterApp();
});
$('#logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload();});
async function boot(){const {data}=await sb.auth.getSession();if(data.session)enterApp();}
async function enterApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await cargarPesos();await verPlanillas();}
async function cargarPesos(){const {data}=await sb.from('pesos_evaluacion').select('*').maybeSingle();if(data)PESOS=data;}

// ── Planillas ──
async function verPlanillas(){
  showView('viewPlanillas');$('#topTitle').textContent='Mis cursos';$('#backTop').style.display='none';
  const box=$('#viewPlanillas');box.innerHTML='<div class="spin">Cargando…</div>';
  const {data,error}=await sb.from('planilla').select('*').eq('activo',true).order('anio',{ascending:false}).order('curso');
  if(error){box.innerHTML=`<p class="hint">Error: ${error.message}</p>`;return;}
  if(!data.length){box.innerHTML='<p class="hint">Aún no hay cursos. Cuando califiques un examen en ODET-Escritorio, el curso aparece aquí.</p>';return;}
  box.innerHTML='<p class="hint" style="margin:2px 0 12px">Toca un curso para ver sus estudiantes.</p><div class="plist"></div>';
  const list=box.querySelector('.plist');
  data.forEach(p=>{
    const b=document.createElement('button');b.className='pcard';
    b.innerHTML=`<div class="curso">${p.curso||'—'}</div><div class="meta"><b>${p.asignatura||p.area||p.sigla||'Área'}</b><span>Grado ${p.grado_num}° · Periodo ${p.periodo} · ${p.anio}</span></div><div class="chev">›</div>`;
    b.onclick=()=>verEstudiantes(p);list.appendChild(b);
  });
}

// ── Estudiantes ──
async function verEstudiantes(p){
  CURRENT.planilla=p;showView('viewStudents');
  $('#topTitle').textContent=`Curso ${p.curso}`;$('#backTop').style.display='';$('#backTop').onclick=verPlanillas;
  const box=$('#viewStudents');box.innerHTML='<div class="spin">Cargando…</div>';
  const [est,act]=await Promise.all([
    sb.from('estudiante').select('*').eq('activo',true).eq('curso',p.curso).eq('anio',p.anio).order('nombre'),
    sb.from('actividad').select('*').eq('activo',true).eq('planilla_id',p.id),
  ]);
  CURRENT.estudiantes=est.data||[];CURRENT.actividades=act.data||[];
  const ids=CURRENT.actividades.map(a=>a.id);
  CURRENT.notas=[];
  if(ids.length){const {data}=await sb.from('nota').select('*').eq('activo',true).in('actividad_id',ids);CURRENT.notas=data||[];}

  // barra de reportes (placeholders — falta el formato institucional)
  let html=`<div class="reportes">
    <button class="rbtn" data-rep="corte"><span class="ic">⏱️</span><b>Corte preventivo</b><small>a la fecha</small></button>
    <button class="rbtn" data-rep="boletin"><span class="ic">📄</span><b>Boletín</b><small>fin de periodo</small></button>
    <button class="rbtn" data-rep="puntoedu"><span class="ic">📤</span><b>Exportar</b><small>Punto Edu</small></button>
  </div>`;
  if(!CURRENT.estudiantes.length){ box.innerHTML=html+'<p class="hint">Este curso aún no tiene estudiantes.</p>'; wireReportes(box); return; }
  CURRENT.estudiantes.forEach((e,i)=>{
    const c=consolidado(e.id);const d=desempeno(c);const sin=esSinNombre(e.nombre);
    html+=`<button class="srow" data-eid="${e.id}"><span class="n">${e.numero||i+1}</span>
      <span class="cod">${e.codigo}</span>
      <span class="nom ${sin?'sin':''}">${sin?'sin nombre':e.nombre}</span>
      <span class="pill" style="background:${d.c}">${c!=null?c.toFixed(1):'—'}</span></button>`;
  });
  box.innerHTML=html;
  wireReportes(box);
  box.querySelectorAll('.srow').forEach(b=>b.onclick=()=>verEstudiante(CURRENT.estudiantes.find(x=>x.id===b.dataset.eid)));
}
function wireReportes(box){
  const M={
    corte:['Corte preventivo','Genera un reporte, a la fecha que elijas, de los estudiantes con dificultades o que no han alcanzado los propósitos de las clases — en el formato de la institución. El botón ya queda listo; falta cargar ese formato para completarlo.'],
    boletin:['Boletín de fin de periodo','Genera el boletín del periodo en el formato del colegio. El botón queda listo; lo completamos cuando tengamos el formato oficial.'],
    puntoedu:['Exportar a Punto Edu','Exporta las notas del curso al formato de carga de la plataforma Punto Edu, para no digitarlas dos veces. Queda listo; falta el formato de Punto Edu.'],
  };
  box.querySelectorAll('.rbtn').forEach(b=>b.onclick=()=>{const [t,c]=M[b.dataset.rep];abrirModal(t,c);});
}

// ── cálculo ──
function actividadesDe(s){return CURRENT.actividades.filter(a=>a.saber===s).sort((x,y)=>x.numero-y.numero);}
function notaDe(a,e){return CURRENT.notas.find(n=>n.actividad_id===a&&n.estudiante_id===e);}
function promedioSaber(s,e){const acts=actividadesDe(s);const v=[];acts.forEach(a=>{const n=notaDe(a.id,e);if(n&&n.valor!=null)v.push(Number(n.valor));});return v.length?v.reduce((x,y)=>x+y,0)/v.length:null;}
function consolidado(e){
  const P={cognitivo:PESOS.cognitivo,procedimental:PESOS.procedimental,actitudinal:PESOS.actitudinal,evaluacion:PESOS.evaluacion_periodo};
  let s=0,pt=0;for(const sb of SABERES){const pr=promedioSaber(sb.k,e);if(pr!=null){s+=pr*P[sb.k];pt+=P[sb.k];}}
  return pt?Math.round((s/pt)*10)/10:null;
}

// ── detalle ──
function verEstudiante(e){showView('viewStudent');$('#topTitle').textContent='Estudiante';$('#backTop').style.display='';$('#backTop').onclick=()=>verEstudiantes(CURRENT.planilla);render(e);}
function render(e){
  const box=$('#viewStudent');const c=consolidado(e.id);const d=desempeno(c);const sin=esSinNombre(e.nombre);
  const P={cognitivo:PESOS.cognitivo,procedimental:PESOS.procedimental,actitudinal:PESOS.actitudinal,evaluacion:PESOS.evaluacion_periodo};
  let html=`<div class="hdr-card"><h2>${sin?'Estudiante sin nombre':e.nombre}</h2>
    <span class="mono" style="color:var(--ink-soft);font-size:.8rem">código ${e.codigo}${e.documento?` · doc ${e.documento}`:''}</span>
    <div class="big"><div class="num" id="hdrNum" style="color:${d.c}">${c!=null?c.toFixed(1):'—'}</div>
    <div><b id="hdrDes" style="color:${d.c}">${d.t}</b><br><span class="hint" style="font-size:.8rem">Consolidado del periodo</span></div></div></div>`;
  for(const s of SABERES){
    const acts=actividadesDe(s.k);const pr=promedioSaber(s.k,e.id);
    html+=`<div class="saber"><div class="sh"><span class="chip" style="background:${s.color}"></span><h3>${s.label}</h3><span class="w">${P[s.k]}%</span><span class="pct" data-saber="${s.k}">${pr!=null?pr.toFixed(1):'—'}</span></div>`;
    acts.forEach(a=>{const n=notaDe(a.id,e.id);const v=n&&n.valor!=null?Number(n.valor).toFixed(1):'';
      const optsH=NOTA_VALS.map(o=>`<div class="wopt">${o||'—'}</div>`).join('');
      html+=`<div class="act"><div class="an">${a.nombre||('ACT '+a.numero)}${a.origen==='omr'?'<span class="omrtag">OMR</span>':''}</div>
        <div class="wheel" data-act="${a.id}" data-est="${e.id}" data-val="${v}"><div class="wtrack">${optsH}</div><div class="wband"></div></div></div>`;});
    html+=`<div class="addact"><input placeholder="Nueva actividad de ${s.label.toLowerCase()}" data-newname="${s.k}"><button data-add="${s.k}">+ Agregar</button></div></div>`;
  }
  box.innerHTML=html;
  box.querySelectorAll('.wheel').forEach(w=>initWheel(w,e));
  box.querySelectorAll('button[data-add]').forEach(btn=>btn.addEventListener('click',()=>agregarActividad(btn.dataset.add,box.querySelector(`input[data-newname="${btn.dataset.add}"]`).value.trim(),e)));
}

function initWheel(w, est){
  const H=30;
  const opts=[...w.querySelectorAll('.wopt')];
  const mark=()=>{const i=Math.round(w.scrollTop/H); opts.forEach((o,j)=>o.classList.toggle('on',j===i));};
  const idx=Math.max(0, NOTA_VALS.indexOf(w.dataset.val||''));
  w.scrollTop=idx*H; mark();
  let t;
  w.addEventListener('scroll',()=>{
    mark(); clearTimeout(t);
    t=setTimeout(()=>{
      const i=Math.max(0,Math.min(NOTA_VALS.length-1,Math.round(w.scrollTop/H)));
      const v=NOTA_VALS[i];
      if(v!==w.dataset.val){ w.dataset.val=v; guardarNota(w.dataset.act,w.dataset.est,v,est,false); }
    },150);
  });
}

// ── escrituras ──
function actualizarTotales(est){
  const c=consolidado(est.id); const d=desempeno(c);
  const num=$('#hdrNum'); if(num){num.textContent=c!=null?c.toFixed(1):'—'; num.style.color=d.c;}
  const des=$('#hdrDes'); if(des){des.textContent=d.t; des.style.color=d.c;}
  document.querySelectorAll('.pct[data-saber]').forEach(el=>{const pr=promedioSaber(el.dataset.saber,est.id); el.textContent=pr!=null?pr.toFixed(1):'—';});
}
async function guardarNota(a,e,valStr,est,rerender=true){
  const v=valStr.trim()===''?null:Number(valStr.replace(',','.'));
  if(v!=null&&(isNaN(v)||v<1||v>5)){toast('La nota va de 1.0 a 5.0');return;}
  const now=new Date().toISOString();
  if(v==null){const n=notaDe(a,e);if(n){await sb.from('nota').update({activo:false,actualizado_en:now}).eq('id',n.id);CURRENT.notas=CURRENT.notas.filter(x=>x.id!==n.id);}}
  else{
    const {data,error}=await sb.from('nota').upsert({actividad_id:a,estudiante_id:e,valor:v,fuente:'manual',activo:true,actualizado_en:now},{onConflict:'actividad_id,estudiante_id'}).select().single();
    if(error){toast('No se pudo guardar');return;}
    const i=CURRENT.notas.findIndex(x=>x.actividad_id===a&&x.estudiante_id===e);if(i>=0)CURRENT.notas[i]=data;else CURRENT.notas.push(data);
  }
  toast('Guardado'); if(rerender)render(est); else actualizarTotales(est);
}
async function agregarActividad(saber,nombre,est){
  if(!nombre){toast('Ponle un nombre a la actividad');return;}
  const num=actividadesDe(saber).reduce((m,a)=>Math.max(m,a.numero),0)+1;
  const {data,error}=await sb.from('actividad').insert({planilla_id:CURRENT.planilla.id,saber,numero:num,nombre,origen:'manual',activo:true,actualizado_en:new Date().toISOString()}).select().single();
  if(error){toast('No se pudo crear');return;}
  CURRENT.actividades.push(data);toast('Actividad creada');render(est);
}

function showView(id){['viewPlanillas','viewStudents','viewStudent'].forEach(v=>$('#'+v).classList.toggle('hidden',v!==id));window.scrollTo(0,0);}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
boot();
</script>
